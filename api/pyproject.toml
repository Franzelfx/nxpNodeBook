[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nxp-book"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # The shared health/coverage/capability contract. Pinned by tag: this is a
    # WIRE contract, so an unpinned floating version could change /health under
    # a running consumer.
    "nxp-node-contract @ git+ssh://git@github.com/Franzelfx/nxpNodeContract@v1.1.0",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "httpx==0.27.2",
    "websockets==14.1",
    "asyncpg==0.29.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "tzdata==2024.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-asyncio==0.24.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
